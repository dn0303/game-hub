<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plumplings</title>
<style>
:root{--cream:#fff6e4;--ink:#3b2418;--red:#e2452f;--red2:#b82f20;--jade:#2fae8a;--jade2:#1f8468;--gold:#ffc53d;--bamboo:#e9c98a;--bamboo2:#c99b55;--soy:#5a3524}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd9a8;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Baloo 2","Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0}
#c canvas{display:block;width:100%;height:100%}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.btn{display:block;width:100%;padding:13px 18px;margin:9px 0;border-radius:16px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:18px;letter-spacing:.3px;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}.btn.jade{background:var(--jade);color:#fff}.btn.gold{background:var(--gold)}
.btn.sm{display:inline-block;width:auto;padding:7px 13px;font-size:14px;margin:3px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 rgba(59,36,24,.85);padding:18px 20px}
.trim{background-image:repeating-linear-gradient(90deg,var(--bamboo) 0 14px,var(--bamboo2) 14px 17px);height:12px;border-radius:8px;border:2px solid var(--ink);margin:-6px -6px 12px}
/* menu */
#menu{position:fixed;left:0;top:0;bottom:0;width:min(390px,100vw);padding:22px 22px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;z-index:20;touch-action:pan-y}
#logo{font-size:54px;font-weight:900;line-height:.92;letter-spacing:-1.5px;color:var(--cream);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);transform:rotate(-3deg);margin:0 0 4px}
#logo b{color:var(--gold)}#logo i{font-style:normal;color:#ffb3a1}
#tagline{font-weight:800;font-size:14px;background:var(--ink);color:var(--cream);display:inline-block;padding:4px 12px;border-radius:99px;margin:8px 0 14px;transform:rotate(-2deg)}
input[type=text]{font:inherit;font-weight:800;font-size:17px;width:100%;padding:11px 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);outline:0;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
label.l{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.75;display:block;margin:8px 0 3px}
#netmsg{font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
/* panels */
.panel{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow-y:auto;z-index:30;touch-action:pan-y}
.panel h2{margin:0 0 8px;font-size:24px}
.sw{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);padding:0}
.sw button.on{outline:4px solid var(--gold);transform:scale(1.1)}
.opt button{padding:6px 11px;border-radius:11px;border:2.5px solid var(--ink);background:#fff;font-weight:800;font-size:13px}
.opt button.on{background:var(--gold)}
input[type=range]{width:100%;accent-color:var(--red)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .pe{pointer-events:auto}
#ticket{position:absolute;left:14px;top:14px;max-width:min(330px,62vw);background:var(--cream);border:3px solid var(--ink);border-radius:6px 18px 18px 6px;border-left:12px solid var(--red);padding:7px 14px 8px 12px;box-shadow:0 5px 0 rgba(59,36,24,.8);transform:rotate(-1.2deg)}
#ticket .k{font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--red2)}
#ticket .n{font-size:21px;font-weight:900;line-height:1.05}
#ticket .r{font-size:13.5px;font-weight:700;margin-top:2px}
#clock{position:absolute;right:14px;top:14px;display:flex;gap:8px;align-items:stretch}
#clock>div{background:var(--ink);color:var(--cream);border-radius:16px;padding:6px 14px;text-align:center;border:3px solid var(--cream);box-shadow:0 4px 0 rgba(59,36,24,.5);min-width:74px}
#clock .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#clock .t{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.8}
#tally .v{color:var(--gold)}
#scoreT{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
#scoreT div{min-width:54px;text-align:center;font-weight:900;font-size:24px;color:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 10px;box-shadow:0 4px 0 var(--ink)}
#scoreT div.me{outline:3px solid var(--gold)}
#chef{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(59,36,24,.88);color:var(--cream);font-weight:800;font-size:15px;padding:7px 18px;border-radius:99px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
#chef b{color:var(--gold)}
#banner{position:absolute;left:0;right:0;top:27%;text-align:center}
#banner .big{display:inline-block;font-size:clamp(46px,11vw,110px);font-weight:900;letter-spacing:-2px;color:var(--cream);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);transform:rotate(-3deg);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#banner .sub{display:block;font-size:20px;font-weight:900;margin-top:10px}
#banner .sub span{background:var(--ink);color:var(--cream);padding:5px 16px;border-radius:99px}
#banner.good .big{color:#8dffb4}#banner.bad .big{color:#ff9d8c}#banner.gold .big{color:var(--gold)}
@keyframes pop{from{transform:rotate(-3deg) scale(.2);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
#intro{position:absolute;left:50%;bottom:12%;transform:translateX(-50%) rotate(-1deg);width:min(520px,92vw);text-align:center}
#intro .k{font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--red2)}
#intro .n{font-size:40px;font-weight:900;line-height:1;margin:2px 0 6px}
#intro .r{font-size:17px;font-weight:700}
#intro .q{margin-top:8px;font-size:14px;font-weight:900;background:var(--gold);display:inline-block;border-radius:99px;padding:4px 14px;border:2px solid var(--ink)}
#results{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);text-align:center}
#results h2{margin:0 0 4px;font-size:30px}
#results .grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;max-height:46vh;overflow:hidden}
.chip{font-weight:800;font-size:13px;padding:5px 11px;border-radius:99px;border:2.5px solid var(--ink);background:#fff}
.chip.out{opacity:.45;text-decoration:line-through;background:#e9d9c4}.chip.me{background:var(--gold)}
#lobby{position:absolute;right:14px;top:14px;width:min(290px,80vw)}
#lobby .code{font-size:34px;font-weight:900;letter-spacing:5px;font-variant-numeric:tabular-nums}
#lobby .who{font-size:13px;font-weight:700;margin:6px 0;max-height:110px;overflow:hidden}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,92vw);max-height:80vh;overflow:hidden}
#board .li{display:flex;justify-content:space-between;font-weight:800;font-size:14px;padding:3px 6px;border-bottom:2px dashed rgba(59,36,24,.2)}
#board .li.out{opacity:.4}#board .li.me{background:var(--gold);border-radius:8px}
#spec{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:99px;padding:5px 8px;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(59,36,24,.8)}
#spec button{width:34px;height:34px;border-radius:50%;background:var(--gold);border:2.5px solid var(--ink);font-weight:900;font-size:16px}
#spec .lv{width:auto;border-radius:99px;padding:0 12px;background:#fff}
#hint{position:absolute;left:50%;top:60%;transform:translateX(-50%);background:rgba(59,36,24,.85);color:var(--cream);padding:8px 16px;border-radius:14px;font-weight:800;font-size:14px;text-align:center}
#pause{position:fixed;inset:0;background:rgba(59,36,24,.45);z-index:40;display:flex;align-items:center;justify-content:center}
#pause .card{width:min(340px,92vw)}
#carry{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);border:3px solid var(--ink);border-radius:99px;padding:5px 16px;font-weight:900;font-size:15px}
#fps{position:absolute;left:8px;bottom:6px;font:11px monospace;color:#fff;text-shadow:0 1px 2px #000;opacity:.7}
/* touch */
#touch{position:fixed;inset:0;z-index:9;pointer-events:none}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,246,228,.35);border:3px solid rgba(59,36,24,.55);pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--cream);border:3px solid var(--ink)}
#look{position:absolute;right:0;top:0;bottom:0;width:60%;pointer-events:auto}
.tb{position:absolute;width:74px;height:74px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);font-weight:900;font-size:14px;pointer-events:auto;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.tb.dn{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);filter:brightness(.9)}
#tJump{right:calc(22px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));background:var(--gold);width:86px;height:86px}
#tDive{right:calc(118px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));background:#ffb3a1}
#tGrab{right:calc(30px + env(safe-area-inset-right));bottom:calc(128px + env(safe-area-inset-bottom));background:#aee8d6}
#tMenu{right:calc(14px + env(safe-area-inset-right));top:74px;width:44px;height:44px;font-size:18px}
@media (max-height:520px){#menu{justify-content:flex-start;padding:10px 18px}#logo{font-size:32px}#tagline,#menu label.l{display:none}#menu input[type=text]{padding:6px 12px;font-size:15px;margin-top:6px}.btn{padding:6px 14px;margin:5px 0;font-size:15px;box-shadow:0 3px 0 var(--ink)}.panel .btn{margin-top:8px}#banner{top:16%}#intro{bottom:5%}#intro .n{font-size:28px}}
@media (max-width:640px){#ticket .n{font-size:17px}#clock .v{font-size:19px}#clock>div{min-width:58px;padding:5px 9px}#lobby{top:auto;bottom:calc(170px + env(safe-area-inset-bottom));right:8px;width:210px;padding:10px}#lobby .code{font-size:24px}#scoreT{top:66px}}
</style>

<body>
<div id="c"></div>

<div id="menu">
  <h1 id="logo">Plum<b>p</b>lings<i>!</i></h1>
  <div><span id="tagline">Kitchen chaos for up to 20 dumplings</span></div>
  <div id="mMain">
    <label class="l">Your name</label>
    <input type="text" id="nameIn" maxlength="14" placeholder="Dumpling name" autocomplete="off">
    <button class="btn red" id="bQuick">Quick Play</button>
    <button class="btn jade" id="bCreate">Create Room</button>
    <div class="row"><input type="text" id="codeIn" maxlength="5" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;text-align:center"><button class="btn gold" id="bJoin" style="margin:0">Join Room</button></div>
    <div class="row" style="margin-top:6px"><button class="btn" id="bLocker">Locker</button><button class="btn" id="bSet">Settings</button></div>
    <div id="netmsg"></div>
  </div>
</div>

<div id="locker" class="panel card hide">
  <div class="trim"></div>
  <h2>Locker</h2>
  <label class="l">Dough colour</label><div class="sw" id="lkC"></div>
  <label class="l">Second colour</label><div class="sw" id="lkC2"></div>
  <label class="l">Pattern</label><div class="sw opt" id="lkP"></div>
  <label class="l">Face</label><div class="sw opt" id="lkF"></div>
  <label class="l">Topping</label><div class="sw opt" id="lkH"></div>
  <button class="btn jade" id="lkDone">Looking tasty</button>
</div>

<div id="settings" class="panel card hide">
  <div class="trim"></div>
  <h2>Settings</h2>
  <label class="l">Graphics</label><div class="sw opt" id="stG"></div>
  <label class="l">Volume</label><input type="range" id="stV" min="0" max="100">
  <div class="sw opt" style="margin-top:8px"><button id="stM">Mute</button><button id="stIY">Invert look Y</button><button id="stF">Show FPS</button></div>
  <label class="l">Look sensitivity</label><input type="range" id="stS" min="20" max="250">
  <button class="btn jade" id="stDone">Done</button>
</div>

<div id="hud" class="hide">
  <div id="ticket" class="hide"><div class="k" id="tkK"></div><div class="n" id="tkN"></div><div class="r" id="tkR"></div></div>
  <div id="clock" class="hide"><div id="tally"><div class="v" id="tlV"></div><div class="t" id="tlT"></div></div><div><div class="v" id="ckV"></div><div class="t">time</div></div></div>
  <div id="scoreT" class="hide"></div>
  <div id="lobby" class="card pe hide">
    <div class="trim"></div>
    <label class="l" style="margin-top:0">Room code</label>
    <div class="row"><div class="code" id="lbCode"></div><button class="btn sm gold" id="lbCopy" style="flex:0 0 auto">Copy link</button></div>
    <div class="who" id="lbWho"></div>
    <label class="l">Fill with bots up to</label><div class="sw opt" id="lbBots"></div>
    <button class="btn red" id="lbStart">Start the show</button>
    <div style="font-size:12px;font-weight:700;opacity:.75" id="lbNote"></div>
  </div>
  <div id="banner" class="hide"><span class="big" id="bnBig"></span><span class="sub"><span id="bnSub"></span></span></div>
  <div id="intro" class="card hide"><div class="trim"></div><div class="k" id="inK"></div><div class="n" id="inN"></div><div class="r" id="inR"></div><div class="q" id="inQ"></div></div>
  <div id="results" class="card hide"><div class="trim"></div><h2 id="rsT"></h2><div id="rsS" style="font-weight:800"></div><div class="grid" id="rsG"></div></div>
  <div id="board" class="card hide"><div class="trim"></div><div id="bdL"></div></div>
  <div id="spec" class="pe hide"><button id="spP">&lt;</button><span id="spN"></span><button id="spX">&gt;</button><button class="lv" id="spL">Leave</button></div>
  <div id="carry" class="hide"></div>
  <div id="hint" class="hide"></div>
  <div id="chef" class="hide"></div>
  <div id="fps" class="hide"></div>
</div>

<div id="touch" class="hide">
  <div id="look"></div>
  <div id="joy"><i id="joyK"></i></div>
  <button class="tb" id="tJump">JUMP</button>
  <button class="tb" id="tDive">DIVE</button>
  <button class="tb" id="tGrab">GRAB</button>
  <button class="tb" id="tMenu">II</button>
</div>

<div id="pause" class="hide">
  <div class="card"><div class="trim"></div>
    <h2 style="margin:0 0 6px">Kitchen break</h2>
    <button class="btn jade" id="pzR">Back to the game</button>
    <button class="btn" id="pzS">Settings</button>
    <button class="btn" id="pzK">Locker</button>
    <button class="btn red" id="pzL">Leave to menu</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
// ============================================================
// Plumplings - an original party obstacle-course royale
// ============================================================
const GAME='plumplings', NETVER=1;
const FLAGS=(location.hash||'').slice(1).split(/[&#]/).filter(Boolean);
const flag=n=>FLAGS.includes(n);
const flagVal=n=>{const f=FLAGS.find(s=>s.startsWith(n+'='));return f?f.slice(n.length+1):'';};
const LOCAL=flag('local');
const TOUCH=flag('touch')||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const wrapPi=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};
const smooth=t=>t*t*(3-2*t);
function mulberry(a){a>>>=0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
// deterministic hash -> [0,1)
function h01(a,b){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

// ---------- saved settings ----------
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const CFG=Object.assign({g:TOUCH?'low':'med',vol:0.6,mute:false,sens:1,iy:false,fps:false,name:'',look:null,bots:12},store.get('plumplings_cfg')||{});
function saveCfg(){store.set('plumplings_cfg',CFG);}
const GFX={low:{pr:1,px:1.5e6,sh:0,part:0.4,decor:0.5},med:{pr:1.25,px:2.6e6,sh:1024,part:1,decor:1},high:{pr:1.5,px:4.2e6,sh:2048,part:1.6,decor:1}};
const gfx=()=>GFX[CFG.g]||GFX.med;

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('c').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,1,0.2,700);
camera.position.set(0,6,-10);
const skyCv=document.createElement('canvas');skyCv.width=4;skyCv.height=256;
const skyTex=new THREE.CanvasTexture(skyCv);skyTex.colorSpace=THREE.SRGBColorSpace;
scene.background=skyTex;scene.fog=new THREE.Fog(0xffdcae,90,420);
function setSky(top,mid,low){const g=skyCv.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,top);gr.addColorStop(0.55,mid);gr.addColorStop(1,low);g.fillStyle=gr;g.fillRect(0,0,4,256);skyTex.needsUpdate=true;scene.fog.color.set(mid);}
setSky('#58c7d6','#ffe9c4','#ffc68a');
const hemi=new THREE.HemisphereLight(0xffffff,0xffb27a,1.25);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e0,1.9);sun.position.set(30,50,-20);scene.add(sun);scene.add(sun.target);
sun.shadow.camera.left=-32;sun.shadow.camera.right=32;sun.shadow.camera.top=32;sun.shadow.camera.bottom=-32;sun.shadow.camera.near=10;sun.shadow.camera.far=150;sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.03;
const SUN_OFF=new THREE.Vector3(26,58,-22);
function applyGfx(){
  const q=gfx(),w=innerWidth,h=innerHeight;
  let pr=Math.min(devicePixelRatio||1,q.pr);
  if(w*h*pr*pr>q.px)pr=Math.sqrt(q.px/(w*h));
  renderer.setPixelRatio(pr);renderer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  const sh=q.sh>0;
  if(renderer.shadowMap.enabled!==sh||sun.shadow.mapSize.x!==(q.sh||512)){
    renderer.shadowMap.enabled=sh;sun.castShadow=sh;
    sun.shadow.mapSize.set(q.sh||512,q.sh||512);
    if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
    scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});
  }
}
addEventListener('resize',applyGfx);

// ---------- procedural textures ----------
function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=4;return t;}

// ---------------- Lobby: the Prep Counter ----------------
function buildLobby(C){
  C.plat(0,0,2,36,28,PAL.wood);
  for(let i=-2;i<=2;i++)C.deco(new THREE.BoxGeometry(0.12,0.02,27.6).translate(i*6,0.012,2),PAL.wood2);
  C.turntable(-10,0.12,5,4,0.9,PAL.red,PAL.cream);
  C.spinner(10,0.75,-3,3.4,1.5,0,{});
  C.pad(11,0.05,9,1.3,14,{col:PAL.jade,col2:PAL.cream});
  C.pad(-11,0.05,-6,1.3,11,{col:PAL.jade,col2:PAL.cream});
  // podium of stacked steamers
  C.basket(0,0.35,11,1.7,0.7);C.basket(0,1.0,11,1.45,0.6);C.basket(-3.4,0.3,11,1.5,0.6);C.basket(3.4,0.25,11,1.5,0.5);
  C.podium=[0,1.3,11];
  for(let i=0;i<4;i++){C.box(-5+i*1.1,0.2+i*0.4,-7,1.1,0.4+i*0.8,3,PAL.cream,{});}
  C.spawnZ=1;C.spawnW=16;C.fly={orbit:1,r:20,h:9};C.center=[0,0,2];
  C.spawn=function(i,n,out){const r=mulberry(i*77+3);out.x=(r()-0.5)*18;out.z=-4+r()*8;out.y=0;out.yaw=0;return out;};
}

function pinRamp(C,seed,z0,z1,y0,y1,lanes,half,T,speed,npool){

  for(const s of[-1,1]){g=new THREE.CylinderGeometry(0.28,0.28,1.1,8);g.rotateZ(Math.PI/2);g.translate(s*(half+0.5),0,0);L.push(paint(g,PAL.red));}

  for(let j=0;j<npool;j++){const m=new THREE.Mesh(geo,solidMat);m.castShadow=true;C.group.add(m);
    const h=C.mover(m,0.75,(t,h,m)=>{const kl=Math.floor(t/T);let k=kl-((kl-j)%npool+npool)%npool;const age=t-k*T;
      if(k<0||age>life+0.05){h.on=false;m.visible=false;return;}
      const x=lanes[Math.floor(h01(seed,k*7+z0)*lanes.length)],z=z1-speed*age,y=y0+(z-z0)*slope+0.75;
      h.on=true;m.visible=true;m.position.set(x,y,z);m.rotation.x=-z/0.75;h.ax=x-half;h.bx=x+half;h.ay=h.by=y;h.az=h.bz=z;h.vx=0;h.vy=-slope*speed;h.vz=-speed;h.px=x;},{pow:0.95,dur:1.1});
    h.half=half;pins.push(h);}

  if(inRound()){const i=R.al.indexOf(id);if(i<0){out.x=0;out.y=C.spawnY;out.z=0;out.yaw=0;return out;}
    if(C.spawnTeam){const tm=R.tm[i]|0;let k=0,n=0;for(let j=0;j<R.al.length;j++)if((R.tm[j]|0)===tm){if(j<i)k++;n++;}return C.spawnTeam(tm,k,n,out);}
    return C.spawn(i,R.al.length,out);}
  const h=strHash(id+'x');
  if(R.ph==='W'){if(id===R.wn){out.x=C.podium[0];out.y=C.podium[1];out.z=C.podium[2];out.yaw=Math.PI;return out;}out.x=((h%1000)/1000-0.5)*17;out.z=13+((h>>>10)%1000)/1000*2.6;out.y=0;out.yaw=Math.PI;return out;}
  out.x=((h%1000)/1000-0.5)*22;out.z=-7+((h>>>10)%1000)/1000*9;out.y=0;out.yaw=0;return out;
}
function placeEnt(X){spawnPos(X.id,_sp);X.body.reset(_sp.x,_sp.y+0.05,_sp.z,_sp.yaw);X.body.cp=0;X.body.carry=0;X.fromBody();}
function respawn(X,isMe){const B=X.body;
  if(C.kind==='race'&&B.cp>0){const c=C.cps[B.cp-1];B.reset(c.x+(Math.random()-0.5)*c.w,c.y+1.2,c.z+(Math.random()-0.5)*2,0);B.cp=C.cps.indexOf(c)+1;}
  else{const cp=B.cp;spawnPos(X.id,_sp);B.reset(_sp.x+(Math.random()-0.5),_sp.y+1.2,_sp.z+(Math.random()-0.5),_sp.yaw);B.cp=cp;}
  B.carry=0;if(X.ai){const ai=X.ai;ai.wi=0;if(ai.path)for(let i=0;i<ai.path.length;i++)if(ai.path[i].ck===B.cp)ai.wi=i;ai.progT=roundT();ai.prog=B.z;ai.pk=undefined;}
  if(isMe){sfx('splash');camSnap=true;}
}
function buildCourse(){
  if(C)C.dispose();C=new Course();const rd=ROUNDS[R.rid];
  if(courseKey==='L'||!rd){buildLobby(C);C.kind='lobby';}else{rd.build(C,R.seed,R.n0,R.tms);C.kind=rd.kind;C.rid=R.rid;}
  C.bake();setSky(C.sky[0],C.sky[1],C.sky[2]);brothMat.color.setHex(C.liquid);broth.position.set(C.center[0],C.killY-1.4,C.center[2]);decor.position.set(C.center[0],broth.position.y+4,C.center[2]);
  C.update(roundT());warm();
}
function syncRound(){
  const key=inRound()?'P'+R.rid+R.seed+':'+R.pt:'L',fresh=key!==courseKey;
  if(fresh){courseKey=key;buildCourse();}
  teamOf.clear();if(inRound()&&R.tm.length)R.al.forEach((id,i)=>teamOf.set(id,R.tm[i]|0));
  syncBots();
  if(fresh||ST.lastPh!==R.ph||ST.lastT0!==R.t0){const prev=ST.lastPh;ST.lastPh=R.ph;ST.lastT0=R.t0;onPhase(prev,fresh);}
  if(inRound()){const k=RD().kind;
    if(k==='grab'){const h=R.h.join();if(h!==ST.lastH){const had=ST.lastH.split(',').includes(me.id),has=R.h.includes(me.id);if(ST.lastH&&has&&!had){sfx('good');chef('You nabbed a <b>fortune cookie</b>! Keep it!',2.5);}else if(ST.lastH&&had&&!has){sfx('bad');chef('Your cookie got <b>snatched</b>! Grab one back!',2.5);}ST.lastH=h;}}
    if(k==='team'){const s=R.sc.join();if(s!==ST.lastSc){if(C.setPiles)C.setPiles(R.sc);C.sc=R.sc;if(ST.lastSc&&R.rid==='melee'&&R.ph==='P'){const o=ST.lastSc.split(',');for(let i=0;i<2;i++)if((R.sc[i]|0)>(o[i]|0)){sfx('score');burst(i?-C.FX-2:C.FX+2,2,0,60,CONFETTI,7,11,14,1.6);chef('<b>'+TEAMN[i]+'</b> team scores!',2.5);}}ST.lastSc=s;}}
  }
  hudDirty=true;
}
function onPhase(prev,fresh){
  const inShow=R.al.includes(me.id);
  ST.lastH='';ST.lastSc='';
  if(R.ph==='P'){if(fresh){ST.spec=!inShow;me.e=inShow?0:3;me.ft=0;me.d=R.rid==='pantry'?[0,0,0,0,0]:R.rid==='gong'?[0]:null;placeEnt(me);ST.specId='';ST.fin=0;cookieT.clear();}uiRoundStart();}
  else if(R.ph==='E'){if(fresh){ST.spec=true;me.e=3;}uiRoundEnd(inShow);}
  else if(R.ph==='W'){ST.spec=false;me.e=0;me.d=null;placeEnt(me);uiWinner();}
  else{ST.spec=false;me.e=0;me.d=null;if(fresh)placeEnt(me);uiLobby();}
  if(isDir&&(fresh||R.ph==='W'))dirPlaceBots();
}
// ---------- bots (simulated by the director, mirrored by everyone else) ----------
function wantedBots(){const s=[];if(R.ph==='L'){for(let i=0;i<R.nb;i++)s.push('b'+i);}else for(const id of(R.ph==='W'?R.ros:R.al))if(isBotId(id))s.push(id);return s;}
function newAI(n){const r=mulberry(n*104729+17);return{n,r,sk:0.3+0.7*h01(n,5),path:null,wi:0,tx:0,tz:0,hold:false,jump:false,grab:false,tt:r()*0.1,prog:0,progT:0,team:-1,d:[0,0,0,0,0],gcd:0,wt:0,b:null};}
function syncBots(){
  const want=wantedBots();
  for(const [id,e] of ents)if(e.bot&&!want.includes(id))dropEnt(id);
  for(const id of want){const e=getEnt(id,true);
    if(isDir){if(!e.body){e.body=new Body();e.ai=newAI(e.bn);e.ai.b=e.body;e.body.spd=0.8+0.17*e.ai.sk;if(e.fresh){spawnPos(id,_sp);e.body.reset(_sp.x,_sp.y+0.05,_sp.z,_sp.yaw);}else{e.body.reset(e.x,e.y,e.z,e.yaw);if(C.kind==='race'){let c=0;while(C.cps[c]&&e.z>=C.cps[c].zt)c++;e.body.cp=c;}}e.fresh=false;botPath(e);e.fromBody();}}
    else if(e.body){e.body=null;e.ai=null;e.nx=e.x;e.ny=e.y;e.nz=e.z;e.nt=performance.now()/1000;}}
}
function botPath(e){const ai=e.ai;ai.path=C.mkPath?C.mkPath(ai.r):null;ai.wi=0;ai.pw=-1;ai.pk=undefined;ai.team=teamOf.has(e.id)?teamOf.get(e.id):-1;ai.d=[0,0,0,0,0];ai.wt=0;ai.prog=e.body.z;ai.progT=roundT();
  if(ai.path&&e.body.cp)for(let i=0;i<ai.path.length;i++)if(ai.path[i].ck===e.body.cp)ai.wi=i;}
function dirPlaceBots(){for(const e of ents.values()){if(!e.bot||!e.body)continue;placeEnt(e);e.e=0;e.ft=0;botPath(e);}}
function botThink(X,t){
  const ai=X.ai,B=X.body,inp=B.inp;ai.jump=false;ai.hold=false;ai.grab=false;let dive=false;
  if(R.ph==='W'||R.ph==='E'){inp.mx=inp.mz=0;inp.dive=false;inp.grab=false;inp.jump=ai.r()<(X.id===R.wn||R.nx.includes(X.id)?0.3:0.04);return;}
  if(R.ph==='P'&&t<0){inp.mx=inp.mz=0;inp.jump=inp.dive=inp.grab=false;return;}
  const kind=C.kind;
  if(kind==='lobby'){const d=Math.hypot(B.x-ai.tx,B.z-ai.tz);if(!(ai.wt>t)||d<1){if(d<1&&ai.wt>t)ai.hold=true;else{ai.wt=t+2+ai.r()*5;ai.tx=(ai.r()-0.5)*30;ai.tz=-9+ai.r()*20;if(ai.r()<0.2)ai.jump=true;}}}
  else if(kind==='race'){
    const P=ai.path,w=P&&P[ai.wi];
    if(!w){ai.tx=B.x*0.8;ai.tz=B.z+6;}
    else{if(w.pre&&ai.pw!==ai.wi){ai.pw=ai.wi;w.pre(ai);}
      if(w.f){if(w.f(ai,t))ai.wi++;}
      else{ai.tx=w.x;ai.tz=w.z;const d=Math.hypot(B.x-w.x,B.z-w.z);
        if(w.j){if((d<1.25||(w.rz&&B.z>=w.z-0.25&&d<2.4))&&B.grounded){ai.jump=true;ai.wi++;const n=P[ai.wi];if(n&&n.x!==undefined){ai.tx=n.x;ai.tz=n.z;}}else if(B.z>w.z+2.2&&B.grounded)ai.wi++;}
        else if(d<1.3||B.z>w.z+0.4)ai.wi++;}}
    if(B.z>ai.prog+0.6||ai.hold){ai.prog=Math.max(ai.prog,B.z);ai.progT=t;}else if(t-ai.progT>9){respawn(X,false);}
    if(C.finishZ-B.z<5&&C.finishZ-B.z>2&&B.grounded&&ai.r()<0.2)dive=true;
  }
  else if(kind==='grab'){
    const hold=R.h.includes(X.id);let best=null,bd=1e9;
    for(const id of R.al){if(id===X.id)continue;const Y=EN(id);if(!Y||!activeEnt(Y)||R.h.includes(id)===hold)continue;const d=Math.hypot(Y.x-B.x,Y.z-B.z);if(d<bd){bd=d;best=Y;}}
    if(hold){if(best&&bd<7.5){let dx=B.x-best.x,dz=B.z-best.z;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;const rr=Math.hypot(B.x,B.z);if(rr>11){dx-=B.x/rr*1.4;dz-=B.z/rr*1.4;const p=dx;dx+=-dz*0.6;dz+=p*0.6;}ai.tx=B.x+dx*5;ai.tz=B.z+dz*5;if(bd<2.2&&ai.r()<0.12*ai.sk)dive=true;}
      else if(!(ai.wt>t)){ai.wt=t+2;const a=ai.r()*TAU;ai.tx=Math.sin(a)*9;ai.tz=Math.cos(a)*9;}}
    else if(best){ai.tx=best.x+best.vx*0.25;ai.tz=best.z+best.vz*0.25;if(bd<1.7){ai.grab=true;if(t>ai.gcd){ai.gcd=t+0.3;if(ai.r()<0.35+0.4*ai.sk)doGrab(X,best);}}}
  }
  else if(C.botThink){C.botThink(ai,t);if(ai.dive){dive=true;ai.dive=false;}}
  const dx=ai.tx-B.x,dz=ai.tz-B.z,d=Math.hypot(dx,dz);
  if(ai.hold||d<0.25){inp.mx=inp.mz=0;}else{inp.mx=dx/d;inp.mz=dz/d;}
  if(B.grounded&&B.state===0&&!ai.jump){const hz=C.haz;for(let i=0;i<hz.length;i++){const h=hz[i];if(!h.on||Math.abs(h.ay-(B.y+0.5))>1.3)continue;
      const abx=h.bx-h.ax,abz=h.bz-h.az,l2=abx*abx+abz*abz;let u=l2>1e-6?((B.x-h.ax)*abx+(B.z-h.az)*abz)/l2:0;u=clamp(u,0,1);const qx=h.ax+abx*u,qz=h.az+abz*u,dd=Math.hypot(B.x-qx,B.z-qz);
      if(dd<h.r+1.5){h.vel(qx,h.ay,qz,_hv);if(_hv.x*_hv.x+_hv.z*_hv.z>3&&ai.r()<0.2+0.6*ai.sk){ai.jump=true;break;}}}}
  inp.jump=ai.jump;inp.dive=dive;inp.grab=ai.grab;
}
// ---------- grabs ----------
function applyGrab(T,F){const B=T.body;if(!B||!F)return;const dx=F.x-B.x,dz=F.z-B.z,d=Math.hypot(dx,dz)||1;if(d>3.2)return;B.slowT=0.45;if(B.state===0){B.vx+=dx/d*1.6;B.vz+=dz/d*1.6;}
  if(B.carry&&teamOf.get(F.id)!==teamOf.get(T.id)){B.carry=0;burst(B.x,B.y+1.6,B.z,8,[0xffe9bf],3,4,10,0.6);if(T===me)chef('Bun dropped! Someone grabbed you.',1.8);}}
function tryCookie(fromId,toId){if(R.ph!=='P'||RD().kind!=='grab'||roundT()<0)return;if(!R.h.includes(toId)||R.h.includes(fromId)||!R.al.includes(fromId))return;const a=EN(fromId),b=EN(toId);if(!a||!b||Math.hypot(a.x-b.x,a.z-b.z)>2.6)return;
  const now=netTime();if((cookieT.get(toId)||0)>now)return;R.h=R.h.map(x=>x===toId?fromId:x);cookieT.set(fromId,now+1.4);bump();}
function doGrab(F,T){ // director only: F grabs T
  if(T===me||T.body)applyGrab(T,F);else if(F.bot)Net.send({t:'g',to:T.id,fr:F.id});
  tryCookie(F.id,T.id);}
// ---------- round rules that run on whoever owns the body ----------
function afterStep(X,B,t,isMe){
  if(C.special)C.special(B,t);
  const playing=R.ph==='P'&&t>=0,d=isMe?me.d:X.ai&&X.ai.d;
  if(playing&&C.rid==='pantry'&&d){const tm=teamOf.get(X.id)|0;if(B.state===2)B.carry=0;
    if(!B.carry){if(B.x*B.x+B.z*B.z<21){B.carry=1;if(isMe)sfx('pick');}else for(let k=0;k<C.T;k++){if(k===tm)continue;const b=C.baskets[k];if((B.x-b.x)**2+(B.z-b.z)**2<8.4&&(R.sc[k]|0)>0&&!(X.stT>t)){B.carry=1;d[1+k]++;X.stT=t+1.2;if(isMe){sfx('pick');chef('Sneaky! Now get it home.',1.6);}break;}}}
    else{const b=C.baskets[tm];if((B.x-b.x)**2+(B.z-b.z)**2<8.4){B.carry=0;d[0]++;X.stT=t+0.8;if(isMe)sfx('score');}}}
  if(playing&&C.gong&&d){const g=C.gong,dx=B.x-g.x,dy=B.y+0.55-g.y,dz=B.z-g.z,dd=dx*dx+dy*dy+dz*dz;
    if(dd<g.r*g.r){const hl=Math.hypot(dx,dz)||1;B.vx=dx/hl*6.5;B.vz=dz/hl*6.5;B.vy=3;B.x+=dx/hl*0.3;B.z+=dz/hl*0.3;
      if(t>g.busy&&!(X.rcd>t)){g.busy=t+1.5;g.rung=t;X.rcd=t+1.5;d[0]++;Net.send({t:'gr',rt:r2(t),w:X.id,c:d[0]});gongFx(X.id,d[0]);}}}
  if(B.y<C.killY){
    if(playing&&C.kind==='surv'){X.e=2;burst(B.x,C.killY,B.z,22,[0xffffff,C.liquid],4,7,12,0.8);if(isMe){sfx('splash');ST.spec=true;}}
    else{if(isMe)burst(B.x,C.killY,B.z,16,[0xffffff,C.liquid],4,7,12,0.8);respawn(X,isMe);}
    return;}
  if(C.kind==='race'){const cps=C.cps;while(cps[B.cp]&&B.z>=cps[B.cp].zt&&B.grounded){B.cp++;if(isMe)chef('Checkpoint!',1.2);}
    if(playing&&X.e===0&&B.z>=C.finishZ&&B.y>=C.finY){X.e=1;X.ft=netTime();burst(B.x,B.y+1,B.z,40,CONFETTI,6,10,14,1.4);if(isMe){sfx('good');ST.spec=true;ST.fin=1;hudDirty=true;}}}
}
function gongFx(id,c){if(!C||!C.gong)return;sfx('gong');shake=0.4;burst(0,C.gong.y,0,50,[0xffc53d,0xfff3a0,0xffffff],9,6,10,1.2);chef('<b>'+esc(nameOf(id))+'</b> rings the gong! '+(c|0)+' of 3',2.6);}
function bumpOthers(X,B){ // push myself apart from everyone else (they do the same on their side)
  for(const Y of ents.values()){if(Y===X||!Y.shown||!activeEnt(Y))continue;const dx=B.x-Y.x,dz=B.z-Y.z,d2=dx*dx+dz*dz;if(d2>0.81||d2<1e-6||Math.abs(B.y-Y.y)>1)continue;const d=Math.sqrt(d2),p=(0.9-d)*0.5;B.x+=dx/d*p;B.z+=dz/d*p;
    if(Y.anim===3&&B.state===0){B.vx+=Y.vx*0.05;B.vz+=Y.vz*0.05;}}
  if(X!==me&&!ST.spec&&activeEnt(me)){const dx=B.x-me.x,dz=B.z-me.z,d2=dx*dx+dz*dz;if(d2<0.81&&d2>1e-6&&Math.abs(B.y-me.y)<1){const d=Math.sqrt(d2),p=(0.9-d)*0.5;B.x+=dx/d*p;B.z+=dz/d*p;}}
}
// ---------- the meatball (director simulates, others extrapolate) ----------
const _bi={x:0,z:0};
function ballTouch(b,x,z,vx,vz){const dx=b.x-x,dz=b.z-z,d=Math.hypot(dx,dz);if(d>b.r+0.55||d<1e-3)return false;const nx=dx/d,nz=dz/d,rel=(vx-b.vx)*nx+(vz-b.vz)*nz;if(rel<=0)return false;const k=rel*1.3+1.4;_bi.x=nx*k;_bi.z=nz*k;return true;}
function ballSim(dt,t){const b=C.ball;
  if(t<0||t<b.fz){b.x=b.z=b.vx=b.vz=0;return;}
  if(!ST.spec&&ballTouch(b,me.body.x,me.body.z,me.body.vx,me.body.vz)){b.vx+=_bi.x;b.vz+=_bi.z;}
  for(const e of ents.values()){if(!e.body||!activeEnt(e))continue;if(ballTouch(b,e.body.x,e.body.z,e.body.vx,e.body.vz)){b.vx+=_bi.x;b.vz+=_bi.z;}}
  if(b.x*b.x+b.z*b.z<21){b.vx+=1.1*b.z*dt*1.3;b.vz-=1.1*b.x*dt*1.3;}
  if(Math.abs(b.z)>C.FZ-b.r-0.8)b.vz-=Math.sign(b.z)*5*dt;if(Math.abs(b.x)>C.FX-b.r-0.8&&Math.abs(b.z)>C.GZ)b.vx-=Math.sign(b.x)*5*dt;
  const s=Math.hypot(b.vx,b.vz);if(s>22){b.vx*=22/s;b.vz*=22/s;}const f=Math.exp(-0.4*dt);b.vx*=f;b.vz*=f;
  b.x+=b.vx*dt;b.z+=b.vz*dt;b.rx+=b.vx*dt/b.r;b.rz+=b.vz*dt/b.r;
  const FZ=C.FZ-b.r,FX=C.FX-b.r,mouth=Math.abs(b.z)<C.GZ-b.r*0.6;
  if(b.z>FZ){b.z=FZ;b.vz=-Math.abs(b.vz)*0.8;}else if(b.z<-FZ){b.z=-FZ;b.vz=Math.abs(b.vz)*0.8;}
  if(!mouth){if(b.x>FX&&b.x<C.FX+0.5){b.x=FX;b.vx=-Math.abs(b.vx)*0.8;}else if(b.x<-FX&&b.x>-C.FX-0.5){b.x=-FX;b.vx=Math.abs(b.vx)*0.8;}}
  if(Math.abs(b.x)>C.FX+1.4){const tm=b.x>0?0:1;R.sc[tm]=(R.sc[tm]|0)+1;b.x=b.z=b.vx=b.vz=0;b.fz=t+2.2;R.sc=R.sc.slice();bump();}
}
function ballFollow(dt){const b=C.ball,n=C.ballN;if(!n)return;const age=Math.min(0.4,performance.now()/1000-n.t),tx=n.x+n.vx*age,tz=n.z+n.vz*age;
  if(Math.hypot(tx-b.x,tz-b.z)>8){b.x=tx;b.z=tz;}else{const k=1-Math.exp(-14*dt);b.x+=(tx-b.x)*k;b.z+=(tz-b.z)*k;}b.vx=n.vx;b.vz=n.vz;b.rx+=b.vx*dt/b.r;b.rz+=b.vz*dt/b.r;
  if(!ST.spec&&performance.now()/1000>ST.kickT&&ballTouch(b,me.body.x,me.body.z,me.body.vx,me.body.vz)){ST.kickT=performance.now()/1000+0.08;Net.send({t:'k',v:[r2(_bi.x),r2(_bi.z)]});n.vx+=_bi.x;n.vz+=_bi.z;n.x=b.x;n.z=b.z;n.t=performance.now()/1000;}
}
// ---------- fixed-step simulation ----------
function physTick(dt){
  const t=roundT(),frozen=R.ph==='P'&&t<0;ST.tick++;
  if(!ST.spec){const B=me.body;if(frozen||uiLock()){B.inp.mx=B.inp.mz=0;B.inp.jump=B.inp.dive=B.inp.grab=false;}
    B.step(dt,t,C);bumpOthers(me,B);afterStep(me,B,t,true);}
  if(isDir&&(ST.tick&1)){const d2=dt*2;for(const e of ents.values()){if(!e.body||e.e)continue;const ai=e.ai;ai.tt-=d2;if(ai.tt<=0){ai.tt=0.08+ai.r()*0.03;botThink(e,t);}e.body.step(d2,t,C);bumpOthers(e,e.body);afterStep(e,e.body,t,false);}}
  if(C.ball){if(isDir)ballSim(dt,t);else ballFollow(dt);}
}
// ---------- director ----------
function humanIds(){const a=[me.id],now=performance.now()/1000;for(const e of ents.values())if(!e.bot&&now-e.heard<6)a.push(e.id);return a;}
function elect(now){let best=ST.graced?me.id:'',bj=ST.graced?myJoin:Infinity;
  for(const e of ents.values()){if(e.bot||now-e.heard>5||e.j>=1e12)continue;if(e.j<bj||(e.j===bj&&e.id<best)){bj=e.j;best=e.id;}}
  dirId=best;const was=isDir;isDir=ST.graced&&best===me.id;
  if(isDir!==was){if(isDir){R.rv++;ST.dirty=true;}syncBots();if(isDir&&inRound())for(const e of ents.values())if(e.bot&&e.body)e.ai.team=teamOf.has(e.id)?teamOf.get(e.id):-1;hudDirty=true;}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}

  if(CFG.fps){UI.fpsN=(UI.fpsN||0)+1;UI.fpsT=(UI.fpsT||0)+dt;if(UI.fpsT>=0.5){setTxt($('fps'),Math.round(UI.fpsN/UI.fpsT)+' fps · '+renderer.info.render.calls+' calls · '+Math.round(renderer.info.render.triangles/1000)+'k tris');UI.fpsN=0;UI.fpsT=0;}}
}
// ---------- menus ----------
function showMenu(on){UI.menu=on;vis($('menu'),on);vis($('hud'),!on);vis($('touch'),!on&&TOUCH);hudDirty=true;if(on&&document.pointerLockElement)document.exitPointerLock();}
function openPanel(id){UI.panel=id;vis($('locker'),id==='locker');vis($('settings'),id==='settings');vis($('pause'),false);if(id&&document.pointerLockElement)document.exitPointerLock();if(!id&&UI.pauseRet){UI.pauseRet=false;setPause(true);}}
function setPause(on){UI.pause=on;vis($('pause'),on);if(on&&document.pointerLockElement)document.exitPointerLock();}
function lockPointer(){if(TOUCH||uiLock())return;try{const p=renderer.domElement.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function enter(code){audioInit();me.name=cleanName($('nameIn').value);CFG.name=me.name;saveCfg();me.ch.setName(me.name,true);showMenu(false);joinRoom(code);camYaw=0;if(!flag('nohint'))lockPointer();chef('Welcome to the kitchen, <b>'+esc(me.name)+'</b>! Warm up, then start the show.',6);}
function buildOpts(el,names,get,set){el.innerHTML='';names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{set(i);sfx('ui');for(const c of el.children)c.classList.toggle('on',c===b);};if(get()===i)b.classList.add('on');el.appendChild(b);});}
function buildSw(el,get,set){el.innerHTML='';COLORS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=hex6(c);b.onclick=()=>{set(i);sfx('ui');for(const k of el.children)k.classList.toggle('on',k===b);};if(get()===i)b.classList.add('on');el.appendChild(b);});}
function setLook(L){me.look=lookStr(L);CFG.look=me.look;saveCfg();me.ch.setLook(me.look);ST.helloT=0;}
function initUI(){
  $('nameIn').value=me.name;$('codeIn').value=cleanCode(flagVal('join'));
  $('bQuick').onclick=()=>enter('PARTY');$('bCreate').onclick=()=>enter(rndCode());
  $('bJoin').onclick=()=>{const c=cleanCode($('codeIn').value);if(c.length===5)enter(c);else{$('netmsg').textContent='Room codes are 5 letters or digits.';}};
  $('codeIn').oninput=e=>{e.target.value=cleanCode(e.target.value);};
  $('bLocker').onclick=()=>{audioInit();openPanel('locker');};$('bSet').onclick=()=>{audioInit();openPanel('settings');};
  $('lkDone').onclick=()=>openPanel('');$('stDone').onclick=()=>openPanel('');
  const L=()=>parseLook(me.look);
  buildSw($('lkC'),()=>L().c,i=>{const l=L();l.c=i;setLook(l);});buildSw($('lkC2'),()=>L().c2,i=>{const l=L();l.c2=i;setLook(l);});
  buildOpts($('lkP'),PATTERNS,()=>L().p,i=>{const l=L();l.p=i;setLook(l);});buildOpts($('lkF'),FACES,()=>L().f,i=>{const l=L();l.f=i;setLook(l);});buildOpts($('lkH'),HATS,()=>L().h,i=>{const l=L();l.h=i;setLook(l);});
  buildOpts($('stG'),['Low','Medium','High'],()=>['low','med','high'].indexOf(CFG.g),i=>{CFG.g=['low','med','high'][i];saveCfg();applyGfx();});
  $('stV').value=Math.round(CFG.vol*100);$('stV').oninput=e=>{CFG.vol=e.target.value/100;saveCfg();setVol();};
  $('stS').value=Math.round(CFG.sens*100);$('stS').oninput=e=>{CFG.sens=e.target.value/100;saveCfg();};
  const tog=(id,key,fn)=>{const b=$(id);b.classList.toggle('on',!!CFG[key]);b.onclick=()=>{CFG[key]=!CFG[key];b.classList.toggle('on',CFG[key]);saveCfg();if(fn)fn();};};
  tog('stM','mute',setVol);tog('stIY','iy');tog('stF','fps',()=>vis($('fps'),CFG.fps));vis($('fps'),CFG.fps);
  const lb=$('lbBots');[0,8,12,16,20].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.n=n;b.onclick=()=>{CFG.bots=n;saveCfg();if(isDir){R.bt=n;bump();}else Net.send({t:'bt',n});};lb.appendChild(b);});
  $('lbStart').onclick=()=>{sfx('ui');if(isDir)dirStartShow();else{Net.send({t:'go'});chef('Asking the head chef to start...',2);}};
  $('lbCopy').onclick=()=>{const url=location.href.split('#')[0]+'#join='+Net.room;const done=()=>{$('lbCopy').textContent='Copied!';setTimeout(()=>{$('lbCopy').textContent='Copy link';},1400);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,()=>prompt('Copy this link',url));else prompt('Copy this link',url);};
  $('spP').onclick=()=>specStep(-1);$('spX').onclick=()=>specStep(1);$('spL').onclick=()=>{leaveRoom();showMenu(true);};
  $('pzR').onclick=()=>{setPause(false);lockPointer();};$('pzS').onclick=()=>{UI.pauseRet=true;openPanel('settings');};$('pzK').onclick=()=>{UI.pauseRet=true;openPanel('locker');};$('pzL').onclick=()=>{setPause(false);leaveRoom();showMenu(true);};
  $('tMenu').onclick=()=>setPause(true);
}
// ---------- input ----------
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.code]=true;
  if(e.code==='Tab'){e.preventDefault();if(!UI.board){UI.board=true;vis($('board'),true);drawBoard();}}
  if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  if((e.code==='Enter'||e.code==='NumpadEnter')&&!uiLock()&&ST.inRoom&&R.ph==='L'){$('lbStart').click();return;}
  if(e.code==='Escape'&&!UI.menu){if(!UI.panel&&!UI.pause&&R.ph==='L'&&locked){document.exitPointerLock();return;}if(UI.panel)openPanel('');else setPause(!UI.pause);}
  if(ST.spec&&(e.code==='ArrowLeft'||e.code==='KeyQ'))specStep(-1);if(ST.spec&&(e.code==='ArrowRight'||e.code==='KeyE'))specStep(1);});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Tab'){UI.board=false;vis($('board'),false);}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseGrab=false;});
renderer.domElement.addEventListener('mousedown',e=>{audioInit();if(uiLock())return;if(!locked){lockPointer();return;}if(e.button===0)mouseGrab=true;});
addEventListener('mouseup',e=>{if(e.button===0)mouseGrab=false;});
addEventListener('mousemove',e=>{if(!locked)return;const k=0.0024*CFG.sens;camYaw-=e.movementX*k;camPitch=clamp(camPitch+e.movementY*k*(CFG.iy?-1:1),-0.25,1.35);});
document.addEventListener('pointerlockchange',()=>{const was=locked;locked=document.pointerLockElement===renderer.domElement;if(was&&!locked&&!uiLock()&&ST.inRoom&&R.ph!=='L')setPause(true);mouseGrab=false;});
addEventListener('contextmenu',e=>e.preventDefault());
function initTouch(){
  const joy=$('joy'),knob=$('joyK');let jid=-1,lid=-1,lx=0,ly=0;
  const jmove=e=>{const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}touchIn.mx=x;touchIn.mz=-y;knob.style.transform='translate('+x*38+'px,'+y*38+'px)';};
  joy.addEventListener('pointerdown',e=>{audioInit();jid=e.pointerId;try{joy.setPointerCapture(jid);}catch(_){}jmove(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e);});
  const jend=e=>{if(e.pointerId!==jid)return;jid=-1;touchIn.mx=touchIn.mz=0;knob.style.transform='';};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
  const look=$('look');
  look.addEventListener('pointerdown',e=>{audioInit();lid=e.pointerId;lx=e.clientX;ly=e.clientY;try{look.setPointerCapture(lid);}catch(_){}});
  look.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;const k=0.0052*CFG.sens;camYaw-=(e.clientX-lx)*k;camPitch=clamp(camPitch+(e.clientY-ly)*k*(CFG.iy?-1:1),-0.25,1.35);lx=e.clientX;ly=e.clientY;});
  const lend=e=>{if(e.pointerId===lid)lid=-1;};look.addEventListener('pointerup',lend);look.addEventListener('pointercancel',lend);
  for(const [id,k] of[['tJump','jump'],['tDive','dive'],['tGrab','grab']]){const b=$(id);const dn=e=>{e.preventDefault();audioInit();touchIn[k]=true;b.classList.add('dn');if(ST.spec&&k!=='grab')specStep(k==='jump'?1:-1);},up=e=>{touchIn[k]=false;b.classList.remove('dn');};
    b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);}
}
function readInput(){
  const inp=me.body.inp;let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  f+=touchIn.mz;s+=touchIn.mx;if(TEST.inp){f+=TEST.inp.f||0;s+=TEST.inp.s||0;}
  const sy=Math.sin(camYaw),cy=Math.cos(camYaw);inp.mx=sy*f-cy*s;inp.mz=cy*f+sy*s;
  inp.jump=!!(keys.Space||touchIn.jump||(TEST.inp&&TEST.inp.jump));inp.dive=!!(keys.ShiftLeft||keys.ShiftRight||keys.ControlLeft||keys.ControlRight||touchIn.dive||(TEST.inp&&TEST.inp.dive));inp.grab=!!(keys.KeyE||mouseGrab||touchIn.grab||(TEST.inp&&TEST.inp.grab));
}
// ---------- camera ----------
function camUpdate(dt){
  const now=performance.now()/1000;let instant=camSnap;camSnap=false;
  if(UI.menu){const a=Math.sin(now*0.4)*0.12,pan=UI.panel==='locker'||innerWidth<760?0:-1.25;camP.set(me.x+Math.sin(a)*4.4-pan*0.2,me.y+1.5,me.z+Math.cos(a)*4.4);camL.set(me.x+pan,me.y+0.75,me.z);me.body.yaw+=wrapPi(0.25-me.body.yaw)*Math.min(1,dt*6);}
  else if(R.ph==='W'){const a=Math.sin(now*0.35)*0.7;camP.set(C.podium[0]+Math.sin(a)*8.5,C.podium[1]+2.4,C.podium[2]-Math.cos(a)*8.5);camL.set(C.podium[0],C.podium[1]+0.9,C.podium[2]);}
  else if(R.ph==='P'&&roundT()<-4.3&&C.fly){const u=smooth(clamp((roundT()+8.5)/4.2,0,1)),f=C.fly;
    if(f.orbit){const a=u*1.7+0.6;camP.set(C.center[0]+Math.sin(a)*f.r,C.center[1]+f.h,C.center[2]+Math.cos(a)*f.r);camL.set(C.center[0],C.center[1]+1,C.center[2]);}
    else{camP.set(lerp(f.a[0],f.b[0],u),lerp(f.a[1],f.b[1],u),lerp(f.a[2],f.b[2],u));camL.set(lerp(f.la[0],f.lb[0],u),lerp(f.la[1],f.lb[1],u),lerp(f.la[2],f.lb[2],u));}
    camBlend=1;instant=true;const sp=_sp;spawnPos(me.id,sp);camYaw=sp.yaw;camPitch=0.42;}
  else{let T=me;if(ST.spec&&inRound()){const e=ents.get(ST.specId);if(e)T=e;else{camL.set(C.center[0],C.center[1]+1,C.center[2]);camP.set(C.center[0],C.center[1]+16,C.center[2]-24);T=null;}}
    if(T){const k=instant?1:1-Math.exp(-16*dt);camT.x+=(T.x-camT.x)*k;camT.y+=(T.y+1.25-camT.y)*(instant?1:1-Math.exp(-9*dt));camT.z+=(T.z-camT.z)*k;
      const d=TOUCH?8.2:7.4,cp=Math.cos(camPitch),sp=Math.sin(camPitch);camL.copy(camT);camP.set(camT.x-Math.sin(camYaw)*cp*d,Math.max(camT.y+sp*d,C.killY+0.6),camT.z-Math.cos(camYaw)*cp*d);
      if(C.ball){const b=C.ball,ax=camP.x-camT.x,az=camP.z-camT.z,l2=ax*ax+az*az||1,u=clamp(((b.x-camT.x)*ax+(b.z-camT.z)*az)/l2,0,1),dd=Math.hypot(camT.x+ax*u-b.x,camT.z+az*u-b.z);
        const want=dd<b.r+0.6&&u>0.08?(1-dd/(b.r+0.6))*5.5+1.5:0;camLift+=(want-camLift)*(1-Math.exp(-6*dt));camP.y+=camLift;}else camLift=0;}}
  if(camBlend>0&&!instant){camBlend=Math.max(0,camBlend-dt*1.4);const k=1-Math.exp(-7*dt);camera.position.lerp(camP,k);_v1.copy(camL);camera.lookAt(_v1);}
  else{camera.position.copy(camP);camera.lookAt(camL);}
  if(shake>0){shake=Math.max(0,shake-dt);camera.position.x+=(Math.random()-0.5)*shake*0.7;camera.position.y+=(Math.random()-0.5)*shake*0.7;}
  sun.target.position.copy(camL);sun.position.copy(camL).add(SUN_OFF);
}
// ---------- shader warm-up ----------
const warmRT=new THREE.WebGLRenderTarget(8,8);
function warm(){const offs=[];scene.traverse(o=>{if(o.frustumCulled){offs.push(o);o.frustumCulled=false;}if(o.visible===false&&o.isMesh){offs.push(o);o._wv=1;o.visible=true;}});
  const c1=CB.eyes.count;for(const m of[CB.eyes,CB.feet,CB.arms,CB.band,CB.bun,CB.cookie,...CB.hats])if(m&&!m.count)m.count=1;
  renderer.setRenderTarget(warmRT);renderer.render(scene,camera);renderer.setRenderTarget(null);
  for(const o of offs){if(o._wv){o._wv=0;o.visible=false;}else o.frustumCulled=true;}}
// ---------- frame ----------
const FIX=1/120,TEST={inp:null,hold:false};let acc=0,lastNow=performance.now(),animT=0;
function fx(B){if(B.ev){if(B.ev&EV_JUMP)sfx('jump');if(B.ev&EV_DIVE)sfx('dive');if(B.ev&EV_BONK){sfx('bonk');shake=Math.max(shake,0.25);burst(B.x,B.y+0.8,B.z,10,[0xffffff,0xffc53d],4,4,10,0.5);}if(B.ev&EV_BOUNCE)sfx('bounce');B.ev=0;}}
function tick(dt,render){
  readInput();
  C.update(roundT());
  acc+=dt;let n=0;while(acc>=FIX&&n<130){physTick(FIX);acc-=FIX;n++;}if(acc>FIX)acc=0;
  fx(me.body);for(const e of ents.values())if(e.body)e.body.ev=0;
  gameTick(dt);
  if(!render)return;
  animT+=dt;cbBegin();
  const cook=R.ph==='P'&&R.h.length?R.h:null,cx=camera.position.x,cz=camera.position.z;
  const mv=UI.menu||!ST.spec||!inRound();me.ch.show(mv);
  if(mv){drawFar=false;drawChar(me.ch,me.x,me.y,me.z,me.yaw,me.vx,me.vy,me.vz,me.anim,(me.body.grabbing&&ST.grabId?1:0)|(me.body.carry?2:0)|(cook&&cook.includes(me.id)?4:0),dt,animT,teamOf.has(me.id)?teamOf.get(me.id):-1);}
  for(const e of ents.values()){const v=!UI.menu&&e.shown&&!e.fresh&&activeEnt(e);e.ch.show(v);if(!v)continue;
    drawFar=(e.x-cx)*(e.x-cx)+(e.z-cz)*(e.z-cz)>95*95;
    drawChar(e.ch,e.x,e.y,e.z,e.yaw,e.vx,e.vy,e.vz,e.anim,(e.body?((e.body.grabbing?1:0)|(e.body.carry?2:0)):e.flags&3)|(cook&&cook.includes(e.id)?4:0),dt,animT,teamOf.has(e.id)?teamOf.get(e.id):-1);}
  cbEnd();
  camUpdate(dt);updParticles(dt);
  brothTex.offset.x=(animT*0.006)%1;brothTex.offset.y=(animT*0.004)%1;
  hudFrame(dt);
  renderer.render(scene,camera);
}
function frame(now){requestAnimationFrame(frame);let dt=(now-lastNow)/1000;lastNow=now;if(dt>0.25)dt=0.25;if(dt<=0||TEST.hold)return;tick(dt*TS,true);}
// keep the show running (slowly) when the tab is hidden, so a director who tabs away does not freeze the room
setInterval(()=>{if(!document.hidden||TEST.hold)return;const now=performance.now();let dt=(now-lastNow)/1000;lastNow=now;if(dt>1)dt=1;if(dt>0)tick(dt,false);},250);

// ---------- boot ----------
me=new Ent(Net.id,false);me.body=new Body();me.fresh=false;
me.name=cleanName(CFG.name||('Dumpling'+((Math.random()*90+10)|0)));
me.look=lookStr(parseLook(CFG.look||randomLook(Math.random)));me.ch.setLook(me.look);me.ch.setName(me.name,true);
applyGfx();initUI();initTouch();syncRound();netStatus();
requestAnimationFrame(frame);
window.__game={get R(){return R;},get C(){return C;},get me(){return me;},ents,ST,Net,UI,CFG,TEST,ROUNDS,netTime,roundT,renderer,scene,camera,
  get isDir(){return isDir;},get dirId(){return dirId;},
  join(code){$('nameIn').value=me.name;enter(code||'TEST2');},
  start(){if(isDir)dirStartShow();else Net.send({t:'go'});},
  force(rid,seed){if(!isDir)return false;ST.force=rid;ST.seed=seed||0;if(R.ph==='L')dirStartShow();else{R.al=R.al.filter(id=>EN(id));dirNextRound(rid);}return true;},
  podium(){if(!isDir)return;R.ros=wantedBots().concat(humanIds());R.wn=me.id;R.ph='W';R.t0=netTime();bump();},
  step(dt){const n=Math.max(1,Math.round(dt/FIX));C.update(roundT());for(let i=0;i<n;i++)physTick(FIX);gameTick(dt);},
  frame(dt){tick(dt||1/60,true);},
  setGfx(g){CFG.g=g;applyGfx();},
  info(){renderer.info.autoReset=false;renderer.info.reset();renderer.render(scene,camera);const o={calls:renderer.info.render.calls,tris:renderer.info.render.triangles,pr:renderer.getPixelRatio(),shadow:renderer.shadowMap.enabled?sun.shadow.mapSize.x:0,w:renderer.domElement.width,h:renderer.domElement.height};renderer.info.autoReset=true;return o;},
  spinner(i,t){const h=C.haz[i];return h&&h.angle?h.angle(t):null;},
  names(){const o={};for(const e of ents.values())o[e.id]=e.name;return o;}
};
